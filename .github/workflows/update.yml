name: Update Nanitor agent

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Update version and hash
        run: bash update.sh
      - name: Build
        run: nix build .#nanitor-agent --no-link
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/update-nanitor-agent
          commit-message: "nanitor-agent: update to latest"
          title: "nanitor-agent: update to latest"
          body: "Automated update of version and hash from the Nanitor latest .deb."
